<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>GameLogged - Alterar Senha</title>

  <link rel="stylesheet" href="../css/alterarsenha.css">
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <div class="logo-area">

      <div class="logo-icon">

        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6c63ff"/>
              <stop offset="100%" stop-color="#ff4fd8"/>
            </linearGradient>
          </defs>

          <path
            d="M10 22C10 18 13 16 17 16H47C51 16 54 18 54 22V38C54 45 49 50 42 50H22C15 50 10 45 10 38V22Z"
            stroke="url(#g1)"
            stroke-width="2.5"
          />

          <rect x="17" y="30" width="4" height="10" rx="1" fill="url(#g1)"/>
          <rect x="14" y="33" width="10" height="4" rx="1" fill="url(#g1)"/>

          <circle cx="44" cy="31" r="2.5" fill="url(#g1)"/>
          <circle cx="49" cy="35" r="2.5" fill="url(#g1)"/>
          <circle cx="44" cy="39" r="2.5" fill="url(#g1)"/>
          <circle cx="39" cy="35" r="2.5" fill="url(#g1)"/>

        </svg>

      </div>

      <h1 class="title">
        Bem-Vindo a <span>GameLogged</span>
      </h1>

      <p class="subtitle">
        Redefine a sua senha.
      </p>

    </div>

    <!-- CONTEUDO -->
    <div class="content">

      <h2>
        Alteração de Senha
      </h2>

      <p class="description">
        Crie uma nova senha para acessar sua conta.
      </p>

      <!-- FORM -->
      <form id="passwordForm">

        <!-- NOVA SENHA -->
        <div class="input-group">

          <span class="icon">

            <svg viewBox="0 0 20 20" fill="currentColor">

              <path
                fill-rule="evenodd"
                d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                clip-rule="evenodd"
              />

            </svg>

          </span>

          <input
            type="password"
            id="novaSenha"
            class="input-field"
            placeholder="Digite a nova senha"
          >

        </div>

        <!-- REQUISITOS -->
        <div class="password-rules">

          <span id="rule-special">
            ✗ Pelo menos 1 caractere especial (! @ # $ %)
          </span>

          <span id="rule-upper">
            ✗ Pelo menos 1 letra maiúscula (A-Z)
          </span>

          <span id="rule-length">
            ✗ No mínimo 8 caracteres
          </span>

        </div>

        <!-- CONFIRMAR -->
        <div class="input-group">

          <span class="icon">

            <svg viewBox="0 0 20 20" fill="currentColor">

              <path
                fill-rule="evenodd"
                d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                clip-rule="evenodd"
              />

            </svg>

          </span>

          <input
            type="password"
            id="confirmarSenha"
            class="input-field"
            placeholder="Confirme a nova senha"
          >

        </div>

        <!-- BOTÃO -->
        <button type="submit" class="main-button">
          Alterar
        </button>

      </form>

    </div>

  </div>

  <script src="alterarsenha.js"></script>

</body>
</html>
