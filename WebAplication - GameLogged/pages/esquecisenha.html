<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameLogged - Recuperar Senha</title>

  <link rel="stylesheet" href="../css/esquecisenha.css" />
</head>
<body>

  <div class="app-shell">
    <div class="mobile-card">

      <div class="page-content">

        <!-- Logo -->
        <div class="logo-icon">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="gradientGame" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#5B7CFF"/>
                <stop offset="100%" stop-color="#FF4FD8"/>
              </linearGradient>
            </defs>

            <path
              d="M12 24C12 19 15 16 20 16H44C49 16 52 19 52 24V36C52 43 47 48 40 48H24C17 48 12 43 12 36V24Z"
              stroke="url(#gradientGame)"
              stroke-width="2.5"
            />

            <rect x="18" y="30" width="10" height="4" rx="1" fill="url(#gradientGame)" />
            <rect x="21" y="27" width="4" height="10" rx="1" fill="url(#gradientGame)" />

            <circle cx="42" cy="30" r="2" fill="url(#gradientGame)" />
            <circle cx="46" cy="34" r="2" fill="url(#gradientGame)" />
            <circle cx="42" cy="38" r="2" fill="url(#gradientGame)" />
            <circle cx="38" cy="34" r="2" fill="url(#gradientGame)" />
          </svg>
        </div>

        <!-- Header -->
        <h1 class="page-title">
          Bem-Vindo a <span class="gradient-text">GameLogged</span>
        </h1>

        <p class="page-subtitle">
          Redefina sua senha.
        </p>

        <!-- Form -->
        <div class="form-area">

          <h2 class="form-title">
            Esqueceu a Senha ?
          </h2>

          <p class="form-description">
            Digite o seu e-mail para enviarmos o link de redefinição
          </p>

          <form id="recoverForm">

            <div class="input-group">

              <span class="input-icon">
                <svg viewBox="0 0 20 20" fill="currentColor">
                  <path d="M2 5L10 10L18 5"/>
                  <rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
                </svg>
              </span>

              <input
                type="email"
                id="email"
                class="input-field"
                placeholder="Digite seu e-mail"
              />

            </div>

            <button type="submit" class="submit-button">
              Enviar Link
            </button>

          </form>

        </div>

      </div>

    </div>
  </div>

  <script src="../js/esquecisenha.js"></script>
</body>
</html>
