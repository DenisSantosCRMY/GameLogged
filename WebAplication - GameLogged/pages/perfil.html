<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GameLogged — Perfil</title>

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/perfil.css" />
</head>

<body>

  <div class="profile-shell">

    <div class="profile-card">

      <!-- ── Cover Banner ── -->
      <div class="cover-banner">

        <div class="cover-gradient"></div>
        <div class="cover-overlay"></div>

        <!-- top-right menu -->
        <button class="cover-menu-btn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>

      </div>

      <!-- Avatar -->
      <div class="avatar-wrapper">

        <div class="avatar-ring">
          <img
            src="https://i.pravatar.cc/120?img=12"
            alt="Avatar de Zero Travel"
            class="avatar-img"
          />
        </div>

        <button class="avatar-edit-btn" title="Editar foto">
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
          </svg>
        </button>

      </div>

      <!-- ── Profile Info ── -->
      <div class="profile-info">

        <!-- Identity row -->
        <div class="identity-row">

          <div class="identity-info">

            <h2 class="profile-name">Zero Travel</h2>

            <!-- Platform badges -->
            <div class="platform-badges">

              <span class="badge badge-xbox">X</span>

              <span class="badge badge-ps">P</span>

              <span class="badge badge-pc">PC</span>

              <span class="badge badge-discord">D</span>

            </div>

          </div>

          <!-- Gamer tag badge -->
          <span class="gamer-badge" id="gamerBadge">

            <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12">
              <path d="M8 0L9.72 5.24H15.28L10.78 8.48L12.5 13.72L8 10.48L3.5 13.72L5.22 8.48L0.72 5.24H6.28L8 0Z"/>
            </svg>

            Gamer Master

          </span>

        </div>

        <!-- Stats row -->
        <div class="stats-row">

          <div class="stat-item">
            <span class="stat-value">12.4k</span>
            <span class="stat-label">Seguidores</span>
          </div>

          <div class="stat-divider"></div>

          <div class="stat-item">
            <span class="stat-value">16</span>
            <span class="stat-label">Seguindo</span>
          </div>

          <!-- BOTAO FOLLOW -->
          <button class="btn-follow" id="followBtn">

            <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
              <path d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"/>
            </svg>

            <span>Seguir</span>

          </button>

        </div>

        <!-- Profile tabs -->
        <nav class="profile-tabs">

          <button class="tab-btn" data-tab="bio">
            <span>Perfil</span>
          </button>

          <button class="tab-btn" data-tab="conquistas">
            <span>Conquistas</span>
          </button>

          <button class="tab-btn active" data-tab="jogos">
            <span>Jogos</span>
          </button>

          <button class="tab-btn" data-tab="amigos">
            <span>Amigos</span>
          </button>

          <button class="tab-btn" data-tab="stats">
            <span>Stats</span>
          </button>

        </nav>

        <!-- TAB BIO -->
        <div class="tab-content hidden" id="tab-bio">

          <div class="tab-placeholder">
            <p>Informações do perfil em breve</p>
          </div>

        </div>

        <!-- TAB CONQUISTAS -->
        <div class="tab-content hidden" id="tab-conquistas">

          <div class="tab-placeholder">
            <p>Conquistas em breve</p>
          </div>

        </div>

        <!-- TAB JOGOS -->
        <div class="tab-content" id="tab-jogos">

          <div class="tab-placeholder">

            <p>Lista de jogos em breve</p>

            <span>
              A conexão com a API será implementada na próxima fase.
            </span>

          </div>

        </div>

        <!-- TAB AMIGOS -->
        <div class="tab-content hidden" id="tab-amigos">

          <div class="tab-placeholder">
            <p>Lista de amigos em breve</p>
          </div>

        </div>

        <!-- TAB STATS -->
        <div class="tab-content hidden" id="tab-stats">

          <div class="tab-placeholder">
            <p>Estatísticas em breve</p>
          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- SCRIPT -->
  <script>

    /* =========================
       BOTAO SEGUIR
    ========================= */

    const followBtn = document.getElementById("followBtn");

    followBtn.addEventListener("click", () => {

      followBtn.classList.toggle("following");

      if (followBtn.classList.contains("following")) {

        followBtn.querySelector("span").textContent = "Seguindo";

      } else {

        followBtn.querySelector("span").textContent = "Seguir";

      }

    });

    /* =========================
       GAMER BADGE
    ========================= */

    const gamerBadge = document.getElementById("gamerBadge");

    gamerBadge.addEventListener("click", () => {

      gamerBadge.classList.toggle("active-badge");

      if (gamerBadge.classList.contains("active-badge")) {

        gamerBadge.innerHTML = `
          <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12">
            <path d="M8 0L9.72 5.24H15.28L10.78 8.48L12.5 13.72L8 10.48L3.5 13.72L5.22 8.48L0.72 5.24H6.28L8 0Z"/>
          </svg>
          Elite Gamer
        `;

      } else {

        gamerBadge.innerHTML = `
          <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12">
            <path d="M8 0L9.72 5.24H15.28L10.78 8.48L12.5 13.72L8 10.48L3.5 13.72L5.22 8.48L0.72 5.24H6.28L8 0Z"/>
          </svg>
          Gamer Master
        `;

      }

    });

    /* =========================
       TABS
    ========================= */

    const tabs = document.querySelectorAll(".tab-btn");
    const contents = document.querySelectorAll(".tab-content");

    tabs.forEach((tab) => {

      tab.addEventListener("click", () => {

        const tabId = tab.dataset.tab;

        tabs.forEach((btn) => {
          btn.classList.remove("active");
        });

        tab.classList.add("active");

        contents.forEach((content) => {
          content.classList.add("hidden");
        });

        document
          .getElementById(`tab-${tabId}`)
          .classList.remove("hidden");

      });

    });

  </script>

</body>
</html>
