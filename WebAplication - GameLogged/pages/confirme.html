<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameLogged - Redefinir Senha</title>

  <link rel="stylesheet" href="../css/confirme.css">
</head>
<body>

  <div class="container">

    <!-- LOGO -->
    <div class="logo-area">

      <div class="logo-icon">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6c63ff"/>
              <stop offset="100%" stop-color="#ff4fd8"/>
            </linearGradient>
          </defs>

          <path
            d="M10 22C10 18 13 16 17 16H47C51 16 54 18 54 22V38C54 45 49 50 42 50H22C15 50 10 45 10 38V22Z"
            stroke="url(#g1)"
            stroke-width="2.5"
          />

          <rect x="17" y="30" width="4" height="10" rx="1" fill="url(#g1)"/>
          <rect x="14" y="33" width="10" height="4" rx="1" fill="url(#g1)"/>

          <circle cx="44" cy="31" r="2.5" fill="url(#g1)"/>
          <circle cx="49" cy="35" r="2.5" fill="url(#g1)"/>
          <circle cx="44" cy="39" r="2.5" fill="url(#g1)"/>
          <circle cx="39" cy="35" r="2.5" fill="url(#g1)"/>

        </svg>
      </div>

      <h1 class="title">
        Bem-Vindo a <span>GameLogged</span>
      </h1>

      <p class="subtitle">
        redefina a sua senha.
      </p>

    </div>

    <!-- TEXTO -->
    <div class="content">

      <h2>
        Solicitação confirmada!
      </h2>

      <p class="description">
        Enviamos para o seu e-mail de contato a solicitação
        de redefinição de senha, por gentileza verifique.
      </p>

      <!-- BOTÃO RETORNAR -->
      <button class="main-button" id="btnRetornar">
        Retornar
      </button>

      <!-- NÃO CHEGOU -->
      <div class="help-area">

        <h3>
          Não chegou ?
        </h3>

        <p>
          Não possui problema, você pode solicitar novamente,
          apenas aguarde o tempo e solicite novamente a
          mensagem.
        </p>

      </div>

      <!-- BOTÃO ENVIAR -->
      <button class="main-button" id="btnEnviar">
        Enviar Link
      </button>

    </div>

  </div>

  <script src="confirme.html"></script>

</body>
</html>
